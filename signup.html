<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | With Partner</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
<a href="index.html" class="brand">With <span>Partner</span></a>
<nav><a href="login.html">로그인</a></nav>
</div>

<div class="auth-wrap">
<div class="auth-card">
<h1>회원가입</h1>
<p class="sub">이메일로 간편하게 가입하세요</p>
<form id="signupForm">
<div class="field">
<label>이름</label>
<input type="text" id="name" required maxlength="20" placeholder="예: 홍길동">
</div>
<div class="field">
<label>별명</label>
<input type="text" id="nickname" required maxlength="20" placeholder="예: 김대박 설계사">
</div>
<div class="field">
<label>생년월일 <span style="font-weight:400;opacity:.6;font-size:12px;">(선택)</span></label>
<input type="text" id="birth" inputmode="numeric" maxlength="10" placeholder="1994/05/06">
</div>
<div class="field">
<label>이메일</label>
<input type="email" id="email" required placeholder="you@example.com">
</div>
<div class="field">
<label>비밀번호</label>
<input type="password" id="password" required minlength="6" placeholder="6자 이상">
</div>
<div class="field">
<label>비밀번호 확인</label>
<input type="password" id="password2" required minlength="6" placeholder="비밀번호 재입력">
</div>
<button type="submit" class="btn-primary" id="submitBtn">가입하기</button>
</form>
<div class="links-row">
<a href="login.html">이미 계정이 있으신가요? 로그인</a>
</div>
<div class="msg" id="msg"></div>
</div>
</div>

<footer style="max-width:480px;margin:32px auto 24px;padding:0 24px;text-align:center;font-size:11.5px;color:#8a8f98;line-height:1.7;">
위드파트너스 | 대표: 장진수 | 사업자등록번호: 747-18-02719<br>
경기도 수원시 팔달구 권광로285번길 46, B102호(인계동, 아트빌)<br>
고객센터: wkdwlstn3@naver.com
</footer>

<script src="assets/supabase-client.js"></script>
<script>
// 생년월일 입력칸: 숫자만 입력받아 1994/05/06 형태로 자동으로 슬래시를 붙여준다.
const birthInput = document.getElementById('birth');
birthInput.addEventListener('input', (e)=>{
  const digits = e.target.value.replace(/[^0-9]/g, '').slice(0, 8);
  let out = digits;
  if(digits.length > 4) out = digits.slice(0,4) + '/' + digits.slice(4);
  if(digits.length > 6) out = digits.slice(0,4) + '/' + digits.slice(4,6) + '/' + digits.slice(6);
  e.target.value = out;
});

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className='msg'; msg.textContent='';

  const name = document.getElementById('name').value.trim();
  const nickname = document.getElementById('nickname').value.trim();
  const birthRaw = document.getElementById('birth').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if(!name || !nickname){
    msg.className='msg err show';
    msg.textContent = '이름과 별명을 모두 입력해주세요.';
    return;
  }
  if(password !== password2){
    msg.className='msg err show';
    msg.textContent = '비밀번호가 일치하지 않습니다.';
    return;
  }

  let birth = null;
  if(birthRaw){
    const m = birthRaw.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
    const mm = m && Number(m[2]), dd = m && Number(m[3]);
    if(!m || mm < 1 || mm > 12 || dd < 1 || dd > 31){
      msg.className='msg err show';
      msg.textContent = '생년월일은 1994/05/06 형식으로 입력해주세요.';
      return;
    }
    birth = m[1] + '-' + m[2] + '-' + m[3];
  }

  btn.disabled = true; btn.textContent='가입 처리 중...';

  const emailRedirectTo = window.location.origin + '/login.html';

  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: { emailRedirectTo, data: { name, nickname, birth: birth || null } },
  });

  btn.disabled = false; btn.textContent='가입하기';

  if(error){
    msg.className='msg err show';
    msg.textContent = error.message;
    return;
  }
  msg.className='msg ok show';
  msg.textContent = '가입 신청이 완료되었습니다. 이메일로 발송된 인증 링크를 확인해주세요.';
  document.getElementById('signupForm').reset();
});
</script>
</body>
</html>
