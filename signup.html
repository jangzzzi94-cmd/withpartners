<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | With Partner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13233F; --navy-light:#1D3358; --gold:#B08D57;
    --paper:#FAF8F3; --ink:#1B1F27; --ink-soft:#5B6270; --line:#E4DFD3; --error:#B3402A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',sans-serif;color:var(--ink);background:var(--paper);}
  .shell{display:flex;min-height:100vh;}
  .brand{
    flex:0 0 40%;background:var(--navy);
    background-image:linear-gradient(155deg, var(--navy) 0%, var(--navy-light) 100%);
    color:#F2EFE6;padding:64px 56px;display:flex;flex-direction:column;
    justify-content:space-between;position:relative;overflow:hidden;
  }
  .brand::after{content:"";position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;
    border:1px solid rgba(242,239,230,0.14);border-radius:50%;}
  .brand::before{content:"";position:absolute;right:-40px;bottom:-40px;width:200px;height:200px;
    border:1px solid rgba(176,141,87,0.35);border-radius:50%;}
  .wordmark{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;letter-spacing:-0.01em;}
  .wordmark span{color:var(--gold);}
  .tagline{font-family:'Noto Serif KR',serif;font-size:34px;line-height:1.45;font-weight:500;
    max-width:360px;margin-top:80px;position:relative;z-index:1;}
  .brand-foot{font-size:13px;color:rgba(242,239,230,0.55);position:relative;z-index:1;}
  .panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
  .card{width:100%;max-width:380px;}
  h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;margin:0 0 6px 0;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 28px 0;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:2px;
    font-size:15px;font-family:'Pretendard',sans-serif;background:#fff;color:var(--ink);}
  input:focus{outline:none;border-color:var(--navy);}
  .btn{width:100%;padding:13px 14px;background:var(--navy);color:#F2EFE6;border:none;
    border-radius:2px;font-size:15px;font-weight:600;font-family:'Pretendard',sans-serif;cursor:pointer;margin-top:8px;}
  .btn:hover{background:var(--navy-light);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .msg{margin-top:16px;font-size:13.5px;padding:12px 14px;border-radius:2px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:#EEF3EC;color:#33553B;border:1px solid #C7DAC5;}
  .msg.err{background:#F7EAE6;color:var(--error);border:1px solid #E9C6BB;}
  .foot-link{margin-top:20px;font-size:13.5px;color:var(--ink-soft);text-align:center;}
  .foot-link a{color:var(--navy);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold);}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="wordmark">With<span>·</span>Partner</div>
    <div class="tagline">병력정리와 보장분석,<br>설계사의 일하는 방식을<br>바꾸는 도구</div>
    <div class="brand-foot">With Partner</div>
  </div>
  <div class="panel">
    <div class="card">
      <h1>계정을 만드세요</h1>
      <p class="sub">가입 후 인증 이메일의 링크를 눌러 완료하세요.</p>
      <div class="field">
        <label>이름</label>
        <input type="text" id="name" placeholder="실명 입력">
      </div>
      <div class="field">
        <label>생년월일</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="birthY" placeholder="YYYY" maxlength="4" inputmode="numeric" style="width:80px;text-align:center;">
          <span style="color:var(--ink-soft);">-</span>
          <input type="text" id="birthM" placeholder="MM" maxlength="2" inputmode="numeric" style="width:54px;text-align:center;">
          <span style="color:var(--ink-soft);">-</span>
          <input type="text" id="birthD" placeholder="DD" maxlength="2" inputmode="numeric" style="width:54px;text-align:center;">
        </div>
      </div>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="email" placeholder="name@example.com">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="8자 이상 입력">
      </div>
      <button class="btn" id="signupBtn">회원가입</button>
      <div class="msg" id="msg"></div>
      <div class="foot-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
  function showMsg(text, ok){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  document.getElementById('birthY').addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9]/g, '');
    if(this.value.length >= 4) document.getElementById('birthM').focus();
  });
  document.getElementById('birthM').addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9]/g, '');
    if(this.value.length >= 2) document.getElementById('birthD').focus();
  });
  document.getElementById('birthD').addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9]/g, '');
  });

  document.getElementById('signupBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('name').value.trim();
    const y = document.getElementById('birthY').value.trim();
    const m = document.getElementById('birthM').value.trim();
    const d = document.getElementById('birthD').value.trim();
    if(!name || y.length !== 4 || !m || !d){ showMsg('이름과 생년월일을 정확히 입력하세요.'); return; }
    const birth = y + '-' + m.padStart(2,'0') + '-' + d.padStart(2,'0');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email || !password){ showMsg('이메일과 비밀번호를 입력하세요.'); return; }
    if(password.length < 8){ showMsg('비밀번호는 8자 이상이어야 합니다.'); return; }

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    const { error } = await supabaseClient.auth.signUp({
      email, password,
      options: {
        emailRedirectTo: window.location.origin + '/dashboard.html',
        data: { name, birth }
      }
    });
    btn.disabled = false;

    if(error){ showMsg(error.message); return; }
    showMsg('가입 확인 메일을 보냈습니다. 메일함에서 인증 링크를 눌러주세요.', true);
  });
</script>
</body>
</html>
