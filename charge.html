<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크레딧 충전 | With Partner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  main{max-width:960px;margin:0 auto;padding:60px 24px;}
  main h1{font-size:26px;color:var(--navy-950);margin:0 0 6px;}
  main p.sub{color:var(--muted);margin:0 0 36px;font-size:14px;}
  .packages{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  @media (max-width:640px){.packages{grid-template-columns:1fr;}}
  .pkg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 26px;transition:.15s;display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;}
  .pkg:hover{border-color:var(--navy-600);box-shadow:0 10px 24px rgba(15,37,69,.08);transform:translateY(-2px);}
  .pkg.selected{border-color:var(--navy-600);box-shadow:0 0 0 2px rgba(43,81,144,.18);}
  .pkg-credits{font-size:19px;font-weight:800;color:var(--navy-950);}
  .pkg-price{font-size:13.5px;color:var(--muted);margin-top:6px;}
  .pkg-bonus{display:inline-block;margin-top:12px;font-size:11.5px;background:var(--navy-100);color:var(--navy-700);padding:4px 10px;border-radius:20px;font-weight:600;}
  .pay-btn{width:100%;padding:14px;background:var(--navy-900);color:#fff;border:none;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;}
  .pay-btn:hover:not(:disabled){background:var(--navy-800);}
  .pay-btn:disabled{background:#a9b6c6;cursor:not-allowed;}
  .msg{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.show{display:block;background:#fdecea;color:var(--danger);}
</style>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partner</span></a>
<nav><a href="profile.html">프로필</a><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>

<main>
  <h1>크레딧 충전</h1>
  <p class="sub">충전한 크레딧으로 병력정리(1크레딧), 보장분석표(3크레딧), 가족보장분석(1크레딧)을 이용할 수 있습니다. 크레딧은 With Partner 서비스 내에서만 사용 가능하며 현금화·양도는 불가합니다.</p>

  <div class="packages" id="packages"></div>

  <button class="pay-btn" id="payBtn" disabled>결제하기</button>
  <div class="msg" id="errMsg"></div>
</main>

<script src="https://js.tosspayments.com/v1/payment"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
  // ⚠️ 토스페이먼츠 개발자센터에서 발급받은 클라이언트 키로 교체하세요 (test_ck_... 또는 live_ck_...)
  const TOSS_CLIENT_KEY = "YOUR_TOSS_CLIENT_KEY";
  const tossPayments = TossPayments(TOSS_CLIENT_KEY);

  // 크레딧 패키지 — 1크레딧 ≈ 1,000원, 대용량 구매 시 10% 추가 지급
  const PACKAGES = [
    { credits: 5,  price: 5000,  bonus: null },
    { credits: 10, price: 10000, bonus: null },
    { credits: 33, price: 30000, bonus: "10% 추가 지급" },
    { credits: 55, price: 50000, bonus: "10% 추가 지급" },
  ];

  let selected = null;
  let currentUser = null;

  function renderPackages(){
    const wrap = document.getElementById("packages");
    wrap.innerHTML = PACKAGES.map((p, i) => `
      <button type="button" class="pkg" data-i="${i}" onclick="selectPackage(${i})">
        <div class="pkg-credits">${p.credits.toLocaleString()} 크레딧</div>
        <div class="pkg-price">${p.price.toLocaleString()}원</div>
        ${p.bonus ? `<div class="pkg-bonus">${p.bonus}</div>` : ""}
      </button>
    `).join("");
  }

  function selectPackage(i){
    selected = PACKAGES[i];
    document.querySelectorAll(".pkg").forEach((el, idx) => {
      el.classList.toggle("selected", idx === i);
    });
    document.getElementById("payBtn").disabled = false;
  }

  async function startPayment(){
    if(!selected || !currentUser) return;
    const errEl = document.getElementById("errMsg");
    errEl.className = "msg";

    const orderId = crypto.randomUUID();

    const { error } = await supabaseClient.from("pending_orders").insert({
      order_id: orderId,
      user_id: currentUser.id,
      points: selected.credits,
      amount: selected.price,
    });

    if(error){
      errEl.textContent = "주문 생성에 실패했습니다: " + error.message;
      errEl.className = "msg show";
      return;
    }

    tossPayments.requestPayment("카드", {
      amount: selected.price,
      orderId: orderId,
      orderName: `크레딧 ${selected.credits.toLocaleString()} 충전`,
      customerEmail: currentUser.email,
      successUrl: window.location.origin + "/charge-success.html",
      failUrl: window.location.origin + "/charge-fail.html",
    });
  }

  document.getElementById("payBtn").addEventListener("click", startPayment);

  (async ()=>{
    const session = await requireLogin();
    if(!session) return;
    currentUser = session.user;
    renderPackages();
  })();
</script>
<script>
  (function(){
    var el = document.getElementById('logoutLink');
    if(!el) return;
    el.addEventListener('click', async function(e){
      e.preventDefault();
      if(typeof logout === 'function'){ await logout(); }
      else { window.location.href = 'login.html'; }
    });
  })();
</script>
</body>
</html>
