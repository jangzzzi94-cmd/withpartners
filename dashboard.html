<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 | With Partner</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.card-grid{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:900px){.card-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.card-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partner</span></a>
<nav><a href="admin.html" id="adminLink" style="display:none">관리자</a><a href="admin-limits.html" id="adminLimitsLink" style="display:none">당타사한도</a><a href="profile.html">프로필</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>

<div class="dash-wrap">
<h1>안녕하세요<span id="userEmail"></span> 👋</h1>
<p class="sub">이용하실 기능을 선택해주세요</p>
<p class="sub" id="pointsLine" style="display:none"></p>

<div style="display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;">
<button type="button" class="btn-ghost" id="showRulesBtn">📌 사용방법 보기</button>
<a href="charge.html" class="btn-ghost" style="text-decoration:none;">💳 크레딧 충전</a>
</div>

<div class="card-grid">
<a href="history.html" class="feature-card">
<div class="icon">📋</div>
<h3>병력정리</h3>
<p>기본진료정보와 세부진료정보를 업로드해 자동으로 병력을 정리하고 고지사항 텍스트를 생성합니다.</p>
<span class="badge-soon" id="historyBadge" style="display:none"></span>
</a>
<a href="coverage.html" class="feature-card">
<div class="icon">📊</div>
<h3>보장분석표</h3>
<p>가입된 보장 내역을 업로드해 보장분석표(전)/(후)를 자동으로 만들고, 종합비교·보장차이까지 한 번에 확인합니다.</p>
<span class="badge-soon" id="coverageBadge" style="display:none"></span>
</a>
<a href="family-coverage.html" class="feature-card">
<div class="icon">👨‍👩‍👧‍👦</div>
<h3>가족보장분석</h3>
<p>가족 구성원별 보장분석표를 모아 하나의 통합 리포트로 비교하고, PDF로 저장합니다.</p>
<span class="badge-soon" id="familyCoverageBadge" style="display:none"></span>
</a>
</div>
</div>

<div id="ruleModalOverlay" class="modal-overlay" style="display:none">
<div class="modal-card" style="max-width:520px;">
<div class="modal-header">
<h2>사용방법</h2>
<button type="button" class="modal-close" id="ruleModalClose" aria-label="닫기">&times;</button>
</div>
<div class="modal-body">
<div id="ruleModalRows">불러오는 중...</div>
</div>
</div>
</div>

<script src="assets/supabase-client.js"></script>
<script>
(async ()=>{
  const session = await requireLogin();
  if(!session) return;
  document.getElementById('userEmail').textContent = ', ' + session.user.email;
  const profile = await getMyProfile();
  if(!profile) return;

  if(profile.suspended){
    alert('이 계정은 정지되었습니다. 관리자에게 문의해주세요.');
    await logout();
    return;
  }

  document.getElementById('userEmail').textContent = ', ' + (profile.nickname || session.user.email);

  if(profile.role === 'admin'){
    document.getElementById('adminLink').style.display = 'inline';
    document.getElementById('adminLimitsLink').style.display = 'inline';
  }

  if(profile.role !== 'admin' && profile.role !== 'gold'){
    const costs = await getPointCosts();
    const pointsLine = document.getElementById('pointsLine');
    pointsLine.textContent = '보유 크레딧: ' + (profile.points || 0) + ' 크레딧';
    pointsLine.style.display = 'block';

    document.getElementById('historyBadge').textContent = '1회 ' + costs.history + '크레딧';
    document.getElementById('historyBadge').style.display = 'inline-block';
    document.getElementById('coverageBadge').textContent = '1회 ' + costs.coverage + '크레딧';
    document.getElementById('coverageBadge').style.display = 'inline-block';
    document.getElementById('familyCoverageBadge').textContent = '1회 ' + costs.family_coverage + '크레딧';
    document.getElementById('familyCoverageBadge').style.display = 'inline-block';
  }
  // 크레딧이 부족해도 도구 페이지에는 들어갈 수 있습니다 (실제 실행 시에만 차감/확인).
})();

function renderRuleRows(rows){
  const wrap = document.getElementById('ruleModalRows');
  wrap.innerHTML = '';
  if(!rows || rows.length === 0){
    wrap.textContent = '등록된 안내가 없습니다.';
    return;
  }
  rows.forEach(function(row){
    const item = document.createElement('div');
    item.className = 'modal-info-row';
    item.style.flexDirection = 'column';
    item.style.alignItems = 'flex-start';
    item.style.gap = '4px';
    const label = document.createElement('div');
    label.className = 'modal-info-label';
    label.textContent = row.title;
    const value = document.createElement('div');
    value.className = 'modal-info-value';
    value.style.textAlign = 'left';
    value.style.whiteSpace = 'pre-wrap';
    value.style.color = 'var(--muted)';
    value.style.fontSize = '13px';
    value.textContent = row.content;
    item.appendChild(label);
    item.appendChild(value);
    wrap.appendChild(item);
  });
}

async function openRuleModal(){
  document.getElementById('ruleModalOverlay').style.display = 'flex';
  const wrap = document.getElementById('ruleModalRows');
  wrap.textContent = '불러오는 중...';
  const rows = await getSiteRules();
  renderRuleRows(rows);
}
function closeRuleModal(){
  document.getElementById('ruleModalOverlay').style.display = 'none';
}
document.getElementById('showRulesBtn').addEventListener('click', openRuleModal);
document.getElementById('ruleModalClose').addEventListener('click', closeRuleModal);
document.getElementById('ruleModalOverlay').addEventListener('click', function(e){
  if(e.target === this) closeRuleModal();
});

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await logout();
});
</script>
</body>
</html>
