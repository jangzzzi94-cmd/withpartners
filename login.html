<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | With Partner</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="navbar">
<a href="index.html" class="brand">With <span>Partner</span></a>
<nav><a href="signup.html">회원가입</a></nav>
</div>

<div class="auth-wrap">
<div class="auth-card">
<h1>로그인</h1>
<p class="sub">계정에 로그인하고 서비스를 이용하세요</p>
<form id="loginForm">
<div class="field">
<label>이메일</label>
<input type="email" id="email" required placeholder="you@example.com">
</div>
<div class="field">
<label>비밀번호</label>
<input type="password" id="password" required placeholder="비밀번호">
</div>
<button type="submit" class="btn-primary" id="submitBtn">로그인</button>
</form>
<div class="links-row">
<a href="reset-password.html">비밀번호 찾기</a>
<a href="signup.html">회원가입</a>
</div>
<div class="msg" id="msg"></div>

</div>
</div>

<style>
  .auth-wrap{ min-height:calc(100vh - 260px) !important; }
  .biz-info{ max-width:720px; margin:20px auto 28px; padding:0 16px 8px; text-align:center;
    font-size:12.5px; line-height:1.85; color:#8b95a1; }
  .biz-info .nm{ font-weight:700; color:#4e5968; }
  .biz-info a{ color:#4e5968; font-weight:600; text-decoration:none; }
  .biz-info a:hover{ text-decoration:underline; }
  .biz-info .cp{ margin-top:6px; color:#b0b8c1; font-size:11.5px; }
  @media (max-width:560px){ .biz-info{ font-size:11.5px; } }
</style>
<footer class="biz-info">
  <div><a href="/refund-policy.html">취소 및 환불 정책</a></div>
  <div><span class="nm">위드파트너스</span> &nbsp;|&nbsp; 대표자명 장진수 &nbsp;|&nbsp; 사업자등록번호 747-18-02719</div>
  <div>사업장 주소 경기도 수원시 팔달구 권광로285번길 46, B102호(인계동, 아트빌)</div>
  <div>유선번호 010-2689-5388 &nbsp;|&nbsp; 이메일 wkdwlstn3@naver.com</div>
  <div class="cp">&copy; 2026 위드파트너스. All rights reserved.</div>
</footer>

<script src="assets/supabase-client.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  btn.disabled = true; btn.textContent='로그인 중...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  btn.disabled = false; btn.textContent='로그인';

  if(error){
    msg.className='msg err show';
    msg.textContent = error.message.includes('Invalid') ? '이메일 또는 비밀번호가 올바르지 않습니다.' : error.message;
    return;
  }
  window.location.href = 'dashboard.html';
});

supabaseClient.auth.getSession().then(({data})=>{
  if(data.session) window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
