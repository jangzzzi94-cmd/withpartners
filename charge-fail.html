<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 | With Partner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#13233F; --paper:#FAF8F3; --ink:#1B1F27; --ink-soft:#5B6270; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',sans-serif;color:var(--ink);background:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;max-width:360px;padding:24px;}
  h1{font-family:'Noto Serif KR',serif;font-size:20px;margin:0 0 10px 0;}
  p{color:var(--ink-soft);font-size:14px;line-height:1.6;}
  .btn{display:inline-block;margin-top:20px;padding:12px 24px;background:var(--navy);
    color:#F2EFE6;text-decoration:none;border-radius:2px;font-size:14px;font-weight:600;}
</style>
</head>
<body>
<div class="box">
  <h1>결제가 완료되지 않았습니다</h1>
  <p id="reason">결제가 취소되었거나 실패했습니다. 크레딧은 지급되지 않았습니다.</p>
  <a class="btn" href="charge.html">다시 시도하기</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const message = params.get("message");
  if(message){
    document.getElementById("reason").textContent = decodeURIComponent(message);
  }
</script>
</body>
</html>
