<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 비밀번호 설정 | With Partner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#13233F; --gold:#B08D57; --paper:#FAF8F3; --ink:#1B1F27; --ink-soft:#5B6270; --line:#E4DFD3; --error:#B3402A; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',sans-serif;color:var(--ink);background:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{width:100%;max-width:380px;padding:24px;}
  h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;margin:0 0 6px 0;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px 0;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:2px;font-size:15px;font-family:inherit;margin-bottom:16px;}
  .btn{width:100%;padding:13px 14px;background:var(--navy);color:#F2EFE6;border:none;border-radius:2px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .msg{margin-top:16px;font-size:13.5px;padding:12px 14px;border-radius:2px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:#EEF3EC;color:#33553B;border:1px solid #C7DAC5;}
  .msg.err{background:#F7EAE6;color:var(--error);border:1px solid #E9C6BB;}
</style>
</head>
<body>
<div class="card">
  <h1>새 비밀번호 설정</h1>
  <p class="sub">새로 사용하실 비밀번호를 입력해주세요.</p>
  <label>새 비밀번호</label>
  <input type="password" id="password" placeholder="8자 이상 입력">
  <button class="btn" id="saveBtn">변경하기</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
  function showMsg(text, ok){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }
  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const password = document.getElementById('password').value;
    if(password.length < 8){ showMsg('비밀번호는 8자 이상이어야 합니다.'); return; }
    const result = await updateMyPassword(password);
    if(!result.ok){ showMsg(result.message); return; }
    showMsg('비밀번호가 변경되었습니다. 로그인 페이지로 이동합니다...', true);
    setTimeout(()=>{ window.location.href = 'login.html'; }, 1500);
  });
</script>
</body>
</html>
