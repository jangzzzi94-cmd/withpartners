<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로필 | With Partner</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:24px;}
@media (max-width:640px){.profile-grid{grid-template-columns:1fr;}}
.profile-item .lbl{font-size:12px;color:var(--muted);margin-bottom:2px;}
.profile-item .val{font-size:14.5px;font-weight:600;}
.pw-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.pw-row input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
.cover-picker{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:crosshair;}
.cover-picker img{display:block;max-width:100%;height:auto;}
.cover-marker{position:absolute;width:14px;height:14px;background:#e8c547;border:2px solid #132a4c;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;}
.danger-zone{border:1px solid #f0c9c0;background:#fdf3f1;border-radius:12px;padding:18px;margin-top:32px;}
</style>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partner</span></a>
<nav><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>

<div class="dash-wrap">
<h1>프로필</h1>
<p class="sub">내 정보를 확인하고 비밀번호를 변경할 수 있습니다.</p>

<div class="auth-card" style="max-width:100%;padding:24px 22px;margin-bottom:24px;">
  <div class="profile-grid" id="profileInfo">
    <div class="loading">불러오는 중…</div>
  </div>
  <div class="pw-row" style="margin-top:14px;">
    <div class="field" style="margin:0;">
      <label>이름</label>
      <input type="text" id="editName" placeholder="이름">
    </div>
    <div class="field" style="margin:0;">
      <label>생년월일</label>
      <input type="date" id="editBirth">
    </div>
    <button type="button" class="btn-ghost" id="saveInfoBtn">저장</button>
  </div>
  <div class="msg" id="infoMsg"></div>
</div>

<div class="auth-card" style="max-width:100%;padding:24px 22px;margin-bottom:24px;">
  <h3 style="margin:0 0 12px;font-size:15px;">비밀번호 변경</h3>
  <div class="pw-row">
    <input type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상)">
    <button type="button" class="btn-ghost" id="changePwBtn">변경하기</button>
  </div>
  <div class="msg" id="pwMsg"></div>
</div>

<div class="auth-card" style="max-width:100%;padding:24px 22px;display:none;" id="coverSection">
  <h3 style="margin:0 0 8px;font-size:15px;">보장분석표 표지 — 고객명 위치</h3>
  <p class="sub" style="margin-bottom:14px;">이미지를 클릭한 위치에 고객명이 표시됩니다. 관리자가 설정한 기본 위치를 그대로 쓰려면 아무것도 안 하셔도 됩니다.</p>
  <div id="coverPickerWrap"></div>
  <div class="msg" id="coverMsg"></div>
</div>

<div class="danger-zone">
  <h3 style="margin:0 0 8px;font-size:14px;color:#a94136;">회원 탈퇴</h3>
  <p class="sub" style="margin-bottom:12px;">탈퇴하면 보유 크레딧을 포함한 모든 정보가 삭제되며 되돌릴 수 없습니다.</p>
  <button type="button" class="btn-ghost" id="deleteAccountBtn" style="color:#a94136;border-color:#e0a89e;">회원 탈퇴</button>
</div>
</div>

<script src="assets/supabase-client.js"></script>
<script>
  let myProfile = null;
  let myStyle = null;
  let pickedX = null, pickedY = null;

  function fmtDate(iso){
    if(!iso) return '-';
    return String(iso).slice(0,10);
  }

  async function init(){
    const session = await requireLogin();
    if(!session) return;
    myProfile = await getMyProfile();
    if(!myProfile) return;

    if(myProfile.suspended){
      alert('이 계정은 정지되었습니다.');
      await logout();
      return;
    }

    document.getElementById('profileInfo').innerHTML = `
      <div class="profile-item"><div class="lbl">이메일</div><div class="val">${myProfile.email||''}</div></div>
      <div class="profile-item"><div class="lbl">닉네임</div><div class="val">${myProfile.nickname||''}</div></div>
      <div class="profile-item"><div class="lbl">보유 크레딧</div><div class="val">${(myProfile.points||0).toLocaleString()} 크레딧</div></div>
      <div class="profile-item"><div class="lbl">가입일</div><div class="val">${fmtDate(myProfile.created_at)}</div></div>
    `;
    document.getElementById('editName').value = myProfile.name || '';
    document.getElementById('editBirth').value = myProfile.birth || '';

    myStyle = await getMyEffectiveCoverStyle(myProfile);
    if(myStyle){
      document.getElementById('coverSection').style.display = 'block';
      renderCoverPicker();
    }
  }

  function renderCoverPicker(){
    const wrap = document.getElementById('coverPickerWrap');
    const x = (myProfile.cover_name_x != null) ? myProfile.cover_name_x : myStyle.name_x_ratio;
    const y = (myProfile.cover_name_y != null) ? myProfile.cover_name_y : myStyle.name_y_ratio;
    pickedX = x; pickedY = y;
    wrap.innerHTML = `
      <div class="cover-picker" id="coverPicker">
        <img src="${getCoverImageUrl(myStyle.image_path)}" alt="${myStyle.name}">
        <div class="cover-marker" id="coverMarker" style="left:${x*100}%;top:${y*100}%;"></div>
      </div>
      <div style="margin-top:12px;"><button type="button" class="btn-ghost" id="saveCoverPosBtn">이 위치로 저장</button></div>
    `;
    const picker = document.getElementById('coverPicker');
    picker.addEventListener('click', (e)=>{
      const rect = picker.getBoundingClientRect();
      pickedX = (e.clientX - rect.left) / rect.width;
      pickedY = (e.clientY - rect.top) / rect.height;
      document.getElementById('coverMarker').style.left = (pickedX*100) + '%';
      document.getElementById('coverMarker').style.top = (pickedY*100) + '%';
    });
    document.getElementById('saveCoverPosBtn').addEventListener('click', async ()=>{
      const result = await updateMyCoverPosition(pickedX, pickedY);
      const msg = document.getElementById('coverMsg');
      if(!result.ok){ msg.textContent = '저장 실패: ' + result.message; msg.className='msg err show'; return; }
      msg.textContent = '저장되었습니다.'; msg.className='msg ok show';
    });
  }

  document.getElementById('saveInfoBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('editName').value.trim();
    const birth = document.getElementById('editBirth').value || null;
    const msg = document.getElementById('infoMsg');
    const { error } = await supabaseClient.from('profiles').update({ name, birth }).eq('id', myProfile.id);
    if(error){ msg.textContent = '저장 실패: ' + error.message; msg.className = 'msg err show'; return; }
    myProfile.name = name; myProfile.birth = birth;
    msg.textContent = '저장되었습니다.'; msg.className = 'msg ok show';
  });

  document.getElementById('changePwBtn').addEventListener('click', async ()=>{
    const pw = document.getElementById('newPassword').value;
    const msg = document.getElementById('pwMsg');
    if(pw.length < 8){ msg.textContent='비밀번호는 8자 이상이어야 합니다.'; msg.className='msg err show'; return; }
    const result = await updateMyPassword(pw);
    if(!result.ok){ msg.textContent = '변경 실패: ' + result.message; msg.className='msg err show'; return; }
    msg.textContent = '비밀번호가 변경되었습니다.'; msg.className='msg ok show';
    document.getElementById('newPassword').value = '';
  });

  document.getElementById('deleteAccountBtn').addEventListener('click', async ()=>{
    if(!confirm('정말로 회원 탈퇴하시겠습니까? 되돌릴 수 없습니다.')) return;
    const result = await deleteMyAccount();
    if(!result.ok){ alert('탈퇴 실패: ' + result.message); return; }
    window.location.href = 'login.html';
  });

  document.getElementById('logoutLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    await logout();
  });

  init();
</script>
</body>
</html>
