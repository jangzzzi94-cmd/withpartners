<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로필 | With Partner</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:24px;}
@media (max-width:640px){.profile-grid{grid-template-columns:1fr;}}
.profile-item .lbl{font-size:12px;color:var(--muted);margin-bottom:2px;}
.profile-item .val{font-size:14.5px;font-weight:600;}
.pw-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.pw-row input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
.cover-picker{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:crosshair;}
.cover-picker img{display:block;max-width:100%;height:auto;}
.cover-marker{position:absolute;width:14px;height:14px;background:#e8c547;border:2px solid #132a4c;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;}
.danger-zone{border:1px solid #f0c9c0;background:#fdf3f1;border-radius:12px;padding:18px;margin-top:32px;}
</style>
</head>
<body>
<div class="navbar">
<a href="dashboard.html" class="brand">With <span>Partner</span></a>
<nav><a href="dashboard.html">대시보드</a><a href="#" id="logoutLink">로그아웃</a></nav>
</div>

<div class="dash-wrap">
<h1>프로필</h1>
<p class="sub">내 정보를 확인하고 비밀번호를 변경할 수 있습니다.</p>

<div class="auth-card" style="max-width:100%;padding:24px 22px;margin-bottom:24px;">
  <div class="profile-grid" id="profileInfo">
    <div class="loading">불러오는 중…</div>
  </div>
  <div class="pw-row" style="margin-top:14px;">
    <div class="field" style="margin:0;">
      <label>이름</label>
      <input type="text" id="editName" placeholder="이름">
    </div>
    <div class="field" style="margin:0;">
      <label>생년월일</label>
      <input type="date" id="editBirth">
    </div>
    <button type="button" class="btn-ghost" id="saveInfoBtn">저장</button>
  </div>
  <div class="msg" id="infoMsg"></div>
</div>

<div class="auth-card" style="max-width:100%;padding:24px 22px;margin-bottom:24px;">
  <h3 style="margin:0 0 12px;font-size:15px;">비밀번호 변경</h3>
  <div class="pw-row">
    <input type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상)">
    <button type="button" class="btn-ghost" id="changePwBtn">변경하기</button>
  </div>
  <div class="msg" id="pwMsg"></div>
</div>

<div class="auth-card" style="max-width:100%;padding:24px 22px;" id="coverSection">
  <h3 style="margin:0 0 8px;font-size:15px;">보장분석표 표지 스타일</h3>
  <p class="sub" style="margin-bottom:14px;">아래에서 사용할 스타일을 고르거나, 내 표지 이미지를 직접 올려서 나만의 스타일을 만들 수 있습니다.</p>

  <div id="allStylesWrap" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px;">불러오는 중...</div>

  <div style="border-top:1px solid var(--line);padding-top:18px;">
    <h4 id="myStyleEditorTitle" style="font-size:14px;margin:0 0 12px;">내 스타일 추가</h4>
    <div class="field">
      <label>스타일 이름</label>
      <input type="text" id="myStyleNameInput" placeholder="예: 스타일1" maxlength="30">
    </div>
    <div class="field">
      <label>이미지 파일 (A4 가로 방향 권장)</label>
      <input type="file" id="myStyleFileInput" accept="image/*">
    </div>
    <div class="field">
      <label>고객 이름 위치 &mdash; 미리보기 위에서 클릭하거나 배지를 드래그해 위치를 잡으세요</label>
      <div id="myStylePreviewWrap" style="position:relative;width:100%;max-width:480px;aspect-ratio:297/210;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#eee;display:none;user-select:none;touch-action:none;">
        <img id="myStylePreviewImg" src="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;pointer-events:none;">
        <div id="myStyleBadge" style="position:absolute;background:#13233F;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:move;border:2px solid #fff;box-sizing:border-box;">이름</div>
      </div>
      <div class="sub" id="myStylePreviewHint" style="margin-top:6px;">이미지를 선택하면 미리보기가 표시됩니다.</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button type="button" class="btn-ghost" id="myStyleSaveBtn">추가</button>
      <button type="button" class="btn-ghost" id="myStyleCancelBtn" style="display:none;">취소</button>
    </div>
    <div class="msg" id="myStyleMsg"></div>
  </div>
</div>

<div class="danger-zone">
  <h3 style="margin:0 0 8px;font-size:14px;color:#a94136;">회원 탈퇴</h3>
  <p class="sub" style="margin-bottom:12px;">탈퇴하면 보유 크레딧을 포함한 모든 정보가 삭제되며 되돌릴 수 없습니다.</p>
  <button type="button" class="btn-ghost" id="deleteAccountBtn" style="color:#a94136;border-color:#e0a89e;">회원 탈퇴</button>
</div>
</div>

<script src="assets/supabase-client.js"></script>
<script>
  let myProfile = null;

  function fmtDate(iso){
    if(!iso) return '-';
    return String(iso).slice(0,10);
  }

  async function init(){
    const session = await requireLogin();
    if(!session) return;
    myProfile = await getMyProfile();
    if(!myProfile) return;

    if(myProfile.suspended){
      alert('이 계정은 정지되었습니다.');
      await logout();
      return;
    }

    document.getElementById('profileInfo').innerHTML = `
      <div class="profile-item"><div class="lbl">이메일</div><div class="val">${myProfile.email||''}</div></div>
      <div class="profile-item"><div class="lbl">닉네임</div><div class="val">${myProfile.nickname||''}</div></div>
      <div class="profile-item"><div class="lbl">보유 크레딧</div><div class="val">${(myProfile.points||0).toLocaleString()} 크레딧</div></div>
      <div class="profile-item"><div class="lbl">가입일</div><div class="val">${fmtDate(myProfile.created_at)}</div></div>
    `;
    document.getElementById('editName').value = myProfile.name || '';
    document.getElementById('editBirth').value = myProfile.birth || '';

    await loadAllStyles();
  }

  /* ============================ 표지 스타일: 선택 목록 ============================ */
  async function loadAllStyles(){
    const wrap = document.getElementById('allStylesWrap');
    wrap.innerHTML = '불러오는 중...';
    const [publicStyles, myStyles] = await Promise.all([getPublicCoverStyles(), getMyCoverStyles()]);
    const all = [...publicStyles.map(s=>({...s, isMine:false})), ...myStyles.map(s=>({...s, isMine:true}))];
    if(!all.length){ wrap.innerHTML = '<div class="sub">등록된 스타일이 없습니다.</div>'; return; }
    wrap.innerHTML = '';
    all.forEach(s=>{
      const isActive = myProfile.cover_style_id === s.id || (!myProfile.cover_style_id && s.is_default);
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid ' + (isActive ? '#B08D57' : 'var(--line)') + ';border-radius:8px;overflow:hidden;background:#fff;' + (isActive ? 'box-shadow:0 0 0 1px #B08D57;' : '');
      card.innerHTML = `
        <div style="position:relative;width:100%;aspect-ratio:297/210;background:#eee;">
          <img src="${getCoverImageUrl(s.image_path)}" style="width:100%;height:100%;object-fit:fill;">
        </div>
        <div style="padding:8px 10px;">
          <div style="font-weight:600;font-size:12.5px;margin-bottom:6px;">${s.name}${s.isMine ? ' (내 스타일)' : ''}${isActive ? ' ✓' : ''}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;"></div>
        </div>
      `;
      const btnRow = card.querySelector('div[style*="flex-wrap"]');
      if(!isActive){
        const selBtn = document.createElement('button');
        selBtn.type='button'; selBtn.className='btn-ghost'; selBtn.textContent='선택';
        selBtn.addEventListener('click', async ()=>{
          const result = await updateMyCoverStyle(s.id);
          if(!result.ok){ alert('선택 실패: ' + result.message); return; }
          myProfile.cover_style_id = s.id;
          await loadAllStyles();
        });
        btnRow.appendChild(selBtn);
      }
      if(s.isMine){
        const editBtn = document.createElement('button');
        editBtn.type='button'; editBtn.className='btn-ghost'; editBtn.textContent='수정';
        editBtn.addEventListener('click', ()=> startEditMyStyle(s));
        btnRow.appendChild(editBtn);
        const delBtn = document.createElement('button');
        delBtn.type='button'; delBtn.className='btn-ghost'; delBtn.style.color='#a94136'; delBtn.textContent='삭제';
        delBtn.addEventListener('click', async ()=>{
          if(!confirm('"' + s.name + '" 스타일을 삭제할까요?')) return;
          const result = await deleteMyCoverStyleRow(s.id);
          if(!result.ok){ alert('삭제 실패: ' + result.message); return; }
          if(editingMyStyleId === s.id) resetMyStyleEditor();
          await loadAllStyles();
        });
        btnRow.appendChild(delBtn);
      }
      wrap.appendChild(card);
    });
  }

  /* ============================ 내 스타일 추가/수정 (드래그 위치 지정) ============================ */
  let editingMyStyleId = null;
  let pendingMyStyleFile = null;
  let myStyleXRatio = 0.2;
  let myStyleYRatio = 0.12;
  const MY_BADGE_W_RATIO = 0.28;
  const MY_BADGE_H_PT = 60;
  const MY_A4_H_PT = 210 * 2.834645669;
  const MY_BADGE_H_RATIO = MY_BADGE_H_PT / MY_A4_H_PT;

  function clampMyRatio(x, y){
    const halfW = MY_BADGE_W_RATIO / 2, halfH = MY_BADGE_H_RATIO / 2;
    return { x: Math.max(halfW, Math.min(1 - halfW, x)), y: Math.max(halfH, Math.min(1 - halfH, y)) };
  }
  function updateMyBadgePosition(){
    const badge = document.getElementById('myStyleBadge');
    badge.style.width = (MY_BADGE_W_RATIO * 100) + '%';
    badge.style.height = (MY_BADGE_H_RATIO * 100) + '%';
    badge.style.left = ((myStyleXRatio - MY_BADGE_W_RATIO / 2) * 100) + '%';
    badge.style.top = ((myStyleYRatio - MY_BADGE_H_RATIO / 2) * 100) + '%';
  }
  function setMyRatioFromPoint(clientX, clientY){
    const wrap = document.getElementById('myStylePreviewWrap');
    const rect = wrap.getBoundingClientRect();
    const clamped = clampMyRatio((clientX - rect.left) / rect.width, (clientY - rect.top) / rect.height);
    myStyleXRatio = clamped.x; myStyleYRatio = clamped.y;
    updateMyBadgePosition();
  }
  function showMyStylePreview(url){
    document.getElementById('myStylePreviewImg').src = url;
    document.getElementById('myStylePreviewWrap').style.display = 'block';
    document.getElementById('myStylePreviewHint').style.display = 'none';
    updateMyBadgePosition();
  }
  function resetMyStyleEditor(){
    editingMyStyleId = null; pendingMyStyleFile = null;
    myStyleXRatio = 0.2; myStyleYRatio = 0.12;
    document.getElementById('myStyleEditorTitle').textContent = '내 스타일 추가';
    document.getElementById('myStyleNameInput').value = '';
    document.getElementById('myStyleFileInput').value = '';
    document.getElementById('myStylePreviewWrap').style.display = 'none';
    document.getElementById('myStylePreviewHint').style.display = '';
    document.getElementById('myStylePreviewHint').textContent = '이미지를 선택하면 미리보기가 표시됩니다.';
    document.getElementById('myStyleSaveBtn').textContent = '추가';
    document.getElementById('myStyleCancelBtn').style.display = 'none';
    document.getElementById('myStyleMsg').className = 'msg';
    document.getElementById('myStyleMsg').textContent = '';
  }
  document.getElementById('myStyleFileInput').addEventListener('change', function(){
    const file = this.files && this.files[0];
    if(!file) return;
    pendingMyStyleFile = file;
    showMyStylePreview(URL.createObjectURL(file));
  });
  document.getElementById('myStylePreviewWrap').addEventListener('click', function(e){
    if(e.target.id === 'myStyleBadge') return;
    setMyRatioFromPoint(e.clientX, e.clientY);
  });
  (function(){
    const badgeEl = document.getElementById('myStyleBadge');
    let dragging = false;
    badgeEl.addEventListener('pointerdown', function(e){ dragging = true; badgeEl.setPointerCapture(e.pointerId); e.stopPropagation(); });
    badgeEl.addEventListener('pointermove', function(e){ if(!dragging) return; setMyRatioFromPoint(e.clientX, e.clientY); });
    badgeEl.addEventListener('pointerup', function(){ dragging = false; });
    badgeEl.addEventListener('pointercancel', function(){ dragging = false; });
  })();
  function startEditMyStyle(style){
    editingMyStyleId = style.id; pendingMyStyleFile = null;
    myStyleXRatio = Number(style.name_x_ratio); myStyleYRatio = Number(style.name_y_ratio);
    document.getElementById('myStyleEditorTitle').textContent = '스타일 수정: ' + style.name;
    document.getElementById('myStyleNameInput').value = style.name;
    document.getElementById('myStyleFileInput').value = '';
    document.getElementById('myStyleSaveBtn').textContent = '저장';
    document.getElementById('myStyleCancelBtn').style.display = 'inline-block';
    showMyStylePreview(getCoverImageUrl(style.image_path));
    document.getElementById('myStylePreviewWrap').scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.getElementById('myStyleCancelBtn').addEventListener('click', resetMyStyleEditor);
  document.getElementById('myStyleSaveBtn').addEventListener('click', async function(){
    const btn = this;
    const msg = document.getElementById('myStyleMsg');
    msg.className = 'msg'; msg.textContent = '';
    const name = document.getElementById('myStyleNameInput').value.trim();
    if(!name){ msg.className='msg err show'; msg.textContent='스타일 이름을 입력해주세요.'; return; }
    if(!editingMyStyleId && !pendingMyStyleFile){ msg.className='msg err show'; msg.textContent='이미지 파일을 선택해주세요.'; return; }
    btn.disabled = true; btn.textContent = '저장 중...';
    let result;
    if(editingMyStyleId){
      const changes = { name, name_x_ratio: myStyleXRatio, name_y_ratio: myStyleYRatio };
      if(pendingMyStyleFile){
        try{ changes.image_path = await uploadMyCoverStyleImage(editingMyStyleId, pendingMyStyleFile); }
        catch(err){ btn.disabled=false; btn.textContent='저장'; msg.className='msg err show'; msg.textContent='업로드 실패: '+err.message; return; }
      }
      result = await updateMyCoverStyleRow(editingMyStyleId, changes);
    } else {
      result = await createMyCoverStyle(name, pendingMyStyleFile, myStyleXRatio, myStyleYRatio);
    }
    btn.disabled = false; btn.textContent = editingMyStyleId ? '저장' : '추가';
    if(!result.ok){ msg.className='msg err show'; msg.textContent='저장 실패: ' + result.message; return; }
    resetMyStyleEditor();
    await loadAllStyles();
  });

  document.getElementById('saveInfoBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('editName').value.trim();
    const birth = document.getElementById('editBirth').value || null;
    const msg = document.getElementById('infoMsg');
    const { error } = await supabaseClient.from('profiles').update({ name, birth }).eq('id', myProfile.id);
    if(error){ msg.textContent = '저장 실패: ' + error.message; msg.className = 'msg err show'; return; }
    myProfile.name = name; myProfile.birth = birth;
    msg.textContent = '저장되었습니다.'; msg.className = 'msg ok show';
  });

  document.getElementById('changePwBtn').addEventListener('click', async ()=>{
    const pw = document.getElementById('newPassword').value;
    const msg = document.getElementById('pwMsg');
    if(pw.length < 8){ msg.textContent='비밀번호는 8자 이상이어야 합니다.'; msg.className='msg err show'; return; }
    const result = await updateMyPassword(pw);
    if(!result.ok){ msg.textContent = '변경 실패: ' + result.message; msg.className='msg err show'; return; }
    msg.textContent = '비밀번호가 변경되었습니다.'; msg.className='msg ok show';
    document.getElementById('newPassword').value = '';
  });

  document.getElementById('deleteAccountBtn').addEventListener('click', async ()=>{
    if(!confirm('정말로 회원 탈퇴하시겠습니까? 되돌릴 수 없습니다.')) return;
    const result = await deleteMyAccount();
    if(!result.ok){ alert('탈퇴 실패: ' + result.message); return; }
    window.location.href = 'login.html';
  });

  document.getElementById('logoutLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    await logout();
  });

  init();
</script>
</body>
</html>
