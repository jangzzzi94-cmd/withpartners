<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 | With Partner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#13233F; --gold:#B08D57; --paper:#FAF8F3; --ink:#1B1F27; --ink-soft:#5B6270; --line:#E4DFD3; --error:#B3402A; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',sans-serif;color:var(--ink);background:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{width:100%;max-width:380px;padding:24px;}
  h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;margin:0 0 6px 0;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px 0;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:2px;font-size:15px;font-family:inherit;margin-bottom:16px;}
  .btn{width:100%;padding:13px 14px;background:var(--navy);color:#F2EFE6;border:none;border-radius:2px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .msg{margin-top:16px;font-size:13.5px;padding:12px 14px;border-radius:2px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:#EEF3EC;color:#33553B;border:1px solid #C7DAC5;}
  .msg.err{background:#F7EAE6;color:var(--error);border:1px solid #E9C6BB;}
  .back{display:block;margin-top:18px;text-align:center;font-size:13.5px;color:var(--ink-soft);}
  .back a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--gold);}
</style>
</head>
<body>
<div class="card">
  <h1>비밀번호 찾기</h1>
  <p class="sub">가입하신 이메일로 재설정 링크를 보내드립니다.</p>
  <label>이메일</label>
  <input type="email" id="email" placeholder="name@example.com">
  <button class="btn" id="sendBtn">재설정 링크 보내기</button>
  <div class="msg" id="msg"></div>
  <div class="back"><a href="login.html">로그인으로 돌아가기</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
  function showMsg(text, ok){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }
  document.getElementById('sendBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('email').value.trim();
    if(!email){ showMsg('이메일을 입력하세요.'); return; }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/update-password.html'
    });
    if(error){ showMsg(error.message); return; }
    showMsg('재설정 링크를 이메일로 보냈습니다. 메일함을 확인해주세요.', true);
  });
</script>
</body>
</html>
